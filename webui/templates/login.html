<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dirracuda &#8211; Login</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
  <div class="login-wrap">
    <h1>Dirracuda Web UI</h1>
    <div id="err" aria-live="polite" role="alert" style="display:none" class="status-error"></div>
    <form id="lf" aria-label="Login">
      <div class="field">
        <label for="u">Username</label>
        <input id="u" name="username" type="text" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="p">Password</label>
        <input id="p" name="password" type="password" autocomplete="current-password" required>
      </div>
      <div class="form-actions">
        <button type="submit">Sign in</button>
      </div>
    </form>
  </div>
  <script>
    document.getElementById('lf').addEventListener('submit', async function(e) {
      e.preventDefault();
      var err = document.getElementById('err');
      err.style.display = 'none';
      var btn = this.querySelector('button[type="submit"]');
      btn.disabled = true;
      try {
        var r = await fetch('/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            username: document.getElementById('u').value,
            password: document.getElementById('p').value
          })
        });
        if (r.ok) {
          window.location.href = '/dashboard';
        } else {
          var b = await r.json().catch(function() { return {}; });
          err.textContent = b.error || 'Login failed.';
          err.style.display = '';
          btn.disabled = false;
        }
      } catch (ex) {
        err.textContent = 'Network error. Please try again.';
        err.style.display = '';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
