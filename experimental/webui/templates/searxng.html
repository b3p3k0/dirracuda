{% extends "base.html" %}
{% block title %}SearXNG{% endblock %}

{% block content %}
<h1>SearXNG Discovery</h1>
<div role="status" id="submit-status" aria-live="polite"></div>

<form id="searxng-form" novalidate>
  <div class="form-section">
    <div class="form-row">
      <label for="instance-url">SearXNG instance URL</label>
      <input id="instance-url" name="instance-url" type="url" placeholder="http://searxng.example.com" maxlength="500">
    </div>
    <div class="form-row">
      <label for="query">Query</label>
      <input id="query" name="query" type="text" placeholder="inurl:index.of filetype:zip" maxlength="500">
    </div>
    <div class="form-row">
      <label for="max-results">Max results</label>
      <input id="max-results" name="max-results" type="number" value="50" min="1" max="500">
    </div>
    <div class="check-row">
      <input id="bulk-probe" name="bulk-probe" type="checkbox">
      <label for="bulk-probe">Bulk probe after run</label>
    </div>
    <div class="form-row" id="probe-workers-row">
      <label for="probe-workers">Probe workers</label>
      <select id="probe-workers" name="probe-workers">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3" selected>3</option>
        <option value="4">4</option>
        <option value="8">8</option>
      </select>
    </div>
  </div>
  <div class="form-actions">
    <button type="submit" id="run-btn">Run Discovery</button>
  </div>
</form>

<div class="queue-section">
  <h2>Queue</h2>
  <div class="table-wrap">
    <table id="queue-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Source</th>
          <th>State</th>
          <th>Progress</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="queue-body">
        <tr><td colspan="5" class="status-text">No active or queued jobs.</td></tr>
      </tbody>
    </table>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script src="/static/searxng.js"></script>
{% endblock %}
