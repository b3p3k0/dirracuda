{% extends "base.html" %}
{% block title %}Results{% endblock %}

{% block content %}
<h1>Results</h1>

<nav class="proto-tabs" aria-label="Protocol tabs">
  <button data-proto="all" class="proto-tab active" type="button">ALL</button>
  <button data-proto="smb" class="proto-tab" type="button">SMB</button>
  <button data-proto="ftp" class="proto-tab" type="button">FTP</button>
  <button data-proto="http" class="proto-tab" type="button">HTTP</button>
</nav>

<div class="filter-bar">
  <label for="country-filter">Country:</label>
  <input id="country-filter" type="text" maxlength="2" placeholder="US" aria-label="Two-letter country filter">
  <label>
    <input id="shares-only-filter" type="checkbox">
    Show Only Shares &gt; 0
  </label>
  <label>
    <input id="favorites-only-filter" type="checkbox">
    Favorites Only
  </label>
  <label>
    <input id="hide-avoid-filter" type="checkbox">
    Hide Avoid
  </label>
  <button id="load-btn" type="button">Refresh</button>
  <button id="first-btn" type="button">&laquo; First</button>
  <button id="prev-btn" type="button">&laquo; Prev</button>
  <button id="next-btn" type="button">Next &raquo;</button>
  <button id="last-btn" type="button">Last &raquo;</button>
  <label for="jump-page">Jump to:</label>
  <input id="jump-page" type="number" min="1" step="1" aria-label="Jump to page">
  <button id="jump-btn" type="button">Go</button>
  <span class="page-label" id="page-label" aria-live="polite"></span>
</div>

<div role="status" id="results-status" aria-live="polite" style="margin-bottom:6px"></div>

<div class="table-wrap">
  <table id="results-table" class="results-table">
    <thead>
      <tr>
        <th>Favorite</th>
        <th>Avoid</th>
        <th>Probed</th>
        <th>RCE</th>
        <th>Extracted</th>
        <th>Type</th>
        <th>IP Address</th>
        <th>Shares</th>
        <th>Accessible</th>
        <th>Denied</th>
        <th>Last Seen</th>
        <th>Country</th>
      </tr>
    </thead>
    <tbody id="results-body">
      <tr><td colspan="12">Loading...</td></tr>
    </tbody>
  </table>
</div>

<div id="export-bar" style="margin-top:16px">
  <button id="export-btn" type="button">Export DB</button>
  <span id="export-status" role="status" aria-live="polite" style="margin-left:8px"></span>
</div>
{% endblock %}

{% block scripts %}
<script>
  var currentProto = 'all';
  var currentPage = 1;
  var pageSize = 50;
  var totalPages = 1;
  var token = document.querySelector('meta[name="csrf-token"]').content;

  function setResults(msg, cls) {
    var el = document.getElementById('results-status');
    el.textContent = msg;
    el.className = cls || '';
  }

  function escHtml(str) {
    if (str == null) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function updatePagerLabel(totalCount, page, pages) {
    document.getElementById('page-label').textContent =
      'Total: ' + totalCount + '   Page ' + page + ' / ' + pages;
  }

  function updatePagerButtons() {
    document.getElementById('first-btn').disabled = currentPage <= 1;
    document.getElementById('prev-btn').disabled = currentPage <= 1;
    document.getElementById('next-btn').disabled = currentPage >= totalPages;
    document.getElementById('last-btn').disabled = currentPage >= totalPages;
  }

  function buildRow(r) {
    var tr = document.createElement('tr');

    var cells = [
      ['Favorite', r.favorite],
      ['Avoid', r.avoid],
      ['Probed', r.probe_status_emoji],
      ['RCE', r.rce_status_emoji],
      ['Extracted', r.extract_status_emoji],
      ['Type', r.host_type],
      ['IP Address', r.ip_address],
      ['Shares', r.shares],
      ['Accessible', r.accessible_shares_list],
      ['Denied', r.denied_shares_count],
      ['Last Seen', r.last_seen],
      ['Country', r.country]
    ];

    cells.forEach(function(pair) {
      var td = document.createElement('td');
      td.setAttribute('data-label', pair[0]);
      td.textContent = pair[1] != null ? String(pair[1]) : '';
      tr.appendChild(td);
    });

    return tr;
  }

  function loadResults() {
    var country = document.getElementById('country-filter').value.trim().toUpperCase();
    var sharesOnly = document.getElementById('shares-only-filter').checked;
    var favoritesOnly = document.getElementById('favorites-only-filter').checked;
    var hideAvoid = document.getElementById('hide-avoid-filter').checked;
    var url = '/api/results/' + currentProto +
      '?page=' + currentPage + '&page_size=' + pageSize +
      '&shares_only=' + (sharesOnly ? 'true' : 'false') +
      '&favorites_only=' + (favoritesOnly ? 'true' : 'false') +
      '&hide_avoid=' + (hideAvoid ? 'true' : 'false');
    if (country) url += '&country=' + encodeURIComponent(country);

    var tbody = document.getElementById('results-body');
    tbody.innerHTML = '<tr><td colspan="12">Loading...</td></tr>';
    setResults('');
    updatePagerButtons();

    fetch(url).then(function(resp) {
      return resp.json().then(function(data) {
        tbody.innerHTML = '';
        if (!resp.ok) {
          setResults('Error: ' + (data.error || resp.status), 'status-error');
          tbody.innerHTML = '<tr><td colspan="12" class="status-text">Query failed.</td></tr>';
          return;
        }
        currentPage = Number(data.page || currentPage);
        totalPages = Number(data.total_pages || 1);
        if (!data.results || !data.results.length) {
          tbody.innerHTML = '<tr><td colspan="12" class="status-text">No results.</td></tr>';
        } else {
          data.results.forEach(function(r) {
            tbody.appendChild(buildRow(r));
          });
        }
        updatePagerLabel(Number(data.total_count || 0), currentPage, totalPages);
        updatePagerButtons();
      });
    }).catch(function() {
      setResults('Request failed.', 'status-error');
      document.getElementById('results-body').innerHTML =
        '<tr><td colspan="12" class="status-text">Request failed.</td></tr>';
      updatePagerButtons();
    });
  }

  document.querySelectorAll('.proto-tab').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.proto-tab').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentProto = btn.getAttribute('data-proto');
      currentPage = 1;
      loadResults();
    });
  });

  document.getElementById('load-btn').addEventListener('click', function() {
    currentPage = 1;
    loadResults();
  });

  document.getElementById('first-btn').addEventListener('click', function() {
    if (currentPage > 1) {
      currentPage = 1;
      loadResults();
    }
  });

  document.getElementById('prev-btn').addEventListener('click', function() {
    if (currentPage > 1) {
      currentPage--;
      loadResults();
    }
  });

  document.getElementById('next-btn').addEventListener('click', function() {
    if (currentPage < totalPages) {
      currentPage++;
      loadResults();
    }
  });

  document.getElementById('last-btn').addEventListener('click', function() {
    if (currentPage < totalPages) {
      currentPage = totalPages;
      loadResults();
    }
  });

  document.getElementById('jump-btn').addEventListener('click', function() {
    var raw = document.getElementById('jump-page').value;
    var jumpPage = Number(raw);
    if (!Number.isInteger(jumpPage) || jumpPage < 1 || jumpPage > totalPages) {
      setResults('Jump-to page must be between 1 and ' + totalPages + '.', 'status-warn');
      return;
    }
    if (jumpPage !== currentPage) {
      currentPage = jumpPage;
      loadResults();
    }
  });

  document.getElementById('jump-page').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      document.getElementById('jump-btn').click();
    }
  });

  document.getElementById('export-btn').addEventListener('click', async function() {
    var es = document.getElementById('export-status');
    es.textContent = 'Exporting...';
    es.className = '';
    try {
      var resp = await fetch('/api/export', {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'X-CSRF-Token': token},
        body: '{}'
      });
      var data = await resp.json();
      if (resp.ok && data.filename) {
        es.textContent = 'Export ready: ' + data.filename;
        es.className = 'status-text ok';
        window.location.href = '/api/export/' + encodeURIComponent(data.filename);
      } else {
        es.textContent = 'Export failed: ' + (data.error || resp.status);
        es.className = 'status-text error';
      }
    } catch (ex) {
      es.textContent = 'Export failed: network error';
      es.className = 'status-text error';
    }
  });

  loadResults();
</script>
{% endblock %}
