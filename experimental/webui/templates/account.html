{% extends "base.html" %}
{% block title %}Account{% endblock %}

{% block content %}
<h1>Change Password</h1>

<div role="status" id="account-status" aria-live="polite"></div>

<form id="change-pw-form" novalidate>
  <div class="form-section">
    <div class="form-row">
      <label for="current-pw">Current Password</label>
      <input id="current-pw" name="current_password" type="password"
             autocomplete="current-password" maxlength="1024" required>
    </div>
    <div class="form-row">
      <label for="new-pw">New Password</label>
      <input id="new-pw" name="new_password" type="password"
             autocomplete="new-password" maxlength="1024" required>
    </div>
  </div>
  <div class="form-actions">
    <button type="submit" id="change-pw-btn">Change Password</button>
  </div>
</form>
{% endblock %}

{% block scripts %}
<script src="/static/account.js"></script>
{% endblock %}
