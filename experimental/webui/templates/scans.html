{% extends "base.html" %}
{% block title %}Scans{% endblock %}

{% block content %}
<h1>Scans</h1>

<div role="status" id="submit-status" aria-live="polite"></div>

<form id="scan-form" novalidate>
  <div class="form-section">
    <div class="check-row">
      <strong>Protocols</strong>
    </div>
    <div class="check-row">
      <input id="proto-smb" name="proto-smb" type="checkbox" checked>
      <label for="proto-smb">SMB</label>
      <input id="proto-ftp" name="proto-ftp" type="checkbox" checked class="proto-checkbox">
      <label for="proto-ftp">FTP</label>
      <input id="proto-http" name="proto-http" type="checkbox" checked class="proto-checkbox">
      <label for="proto-http">HTTP</label>
    </div>
  </div>

  <div class="form-section">
    <div class="form-row">
      <label for="countries">Country</label>
      <input id="countries" name="countries" type="text" placeholder="US,GB (blank = global)" maxlength="200">
    </div>
    <div class="form-row">
      <label for="max-results">Max results</label>
      <input id="max-results" name="max-results" type="number" value="100" min="1" max="10000">
    </div>
    <div class="check-row" title="Rescan options are passed as flags when CLI support is available">
      <input id="rescan-all" name="rescan-all" type="checkbox">
      <label for="rescan-all">Rescan all</label>
      <input id="rescan-failed" name="rescan-failed" type="checkbox" class="proto-checkbox">
      <label for="rescan-failed">Rescan failed</label>
    </div>
    <div class="check-row">
      <input id="probe" name="probe" type="checkbox">
      <label for="probe">Run probe on verified hosts after scan</label>
    </div>
    <div class="form-row">
      <label for="filters">Filters</label>
      <input id="filters" name="filters" type="text" placeholder="Optional Shodan filter string" maxlength="500">
    </div>
  </div>

  <div class="form-actions">
    <button type="submit" id="queue-btn">Review Preflight</button>
  </div>
</form>

<div id="preflight-panel" class="dash-card hidden" role="status" aria-live="polite">
  <h2>Preflight Review</h2>
  <div id="preflight-summary" class="status-text">Run preflight to see cost and balance estimates.</div>
  <div class="form-actions">
    <button type="button" id="preflight-start-btn" disabled>Start Scan</button>
    <button type="button" id="preflight-cancel-btn" disabled>Back to Scan Options</button>
  </div>
</div>

<div class="queue-section">
  <h2>Queue</h2>
  <div class="table-wrap">
    <table id="queue-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Protocol</th>
          <th>State</th>
          <th>Progress</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="queue-body">
        <tr><td colspan="5" class="status-text">No active or queued tasks.</td></tr>
      </tbody>
    </table>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/scans.js"></script>
{% endblock %}
